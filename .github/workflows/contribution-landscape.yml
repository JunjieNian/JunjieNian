name: Generate contribution landscape

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-landscape.yml"
      - "scripts/generate_contribution_landscape.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light and dark decision landscapes
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_contribution_landscape.py --user "$GITHUB_USER" --output-dir dist

      - name: Publish generated SVGs to the output branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
