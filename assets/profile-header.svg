<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Junjie Nian — AI Researcher</title>
  <desc id="desc">A research trajectory map representing work on reasoning models, AI agents, and interpretability.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traceGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .trace { fill: none; stroke-linecap: round; stroke-width: 2.4; stroke-dasharray: 10 12; animation: flow 12s linear infinite; }
    .trace.secondary { stroke-width: 1.4; stroke-dasharray: 5 14; animation-duration: 18s; animation-direction: reverse; }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
    .node.delay-1 { animation-delay: -1.1s; }
    .node.delay-2 { animation-delay: -2.3s; }
    .orbit { transform-origin: 944px 180px; animation: rotate 36s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -220; } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .trace, .node, .orbit { animation: none; } }
  </style>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="40" r="260" fill="url(#violetGlow)"/>
  <circle cx="770" cy="330" r="270" fill="url(#cyanGlow)"/>

  <g opacity="0.65">
    <circle cx="76" cy="54" r="2" fill="#A78BFA"/>
    <circle cx="520" cy="70" r="1.6" fill="#22D3EE"/>
    <circle cx="640" cy="298" r="1.8" fill="#F472B6"/>
    <circle cx="1138" cy="304" r="2" fill="#22D3EE"/>
    <circle cx="686" cy="46" r="1.4" fill="#E0E7FF"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="74" fill="#67E8F9" font-size="14" font-weight="700" letter-spacing="3">AI RESEARCHER · FUDANNLP ALEX LAB</text>
    <text x="70" y="148" fill="#F8FAFC" font-size="54" font-weight="760" letter-spacing="-1.5">Junjie Nian</text>
    <text x="72" y="186" fill="#C4B5FD" font-size="25" font-weight="500" letter-spacing="6">年骏杰</text>
    <text x="72" y="245" fill="#CBD5E1" font-size="18" font-weight="500" letter-spacing="1.2">MAKE REASONING LEGIBLE.</text>
    <text x="72" y="274" fill="#CBD5E1" font-size="18" font-weight="500" letter-spacing="1.2">MAKE AGENTS RELIABLE.</text>
    <text x="72" y="320" fill="#94A3B8" font-size="12" font-weight="650" letter-spacing="2.2">FUDAN UNIVERSITY  ×  UC SAN DIEGO</text>
  </g>

  <g>
    <ellipse class="orbit" cx="944" cy="180" rx="210" ry="118" fill="none" stroke="#A78BFA" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 12"/>
    <ellipse cx="944" cy="180" rx="152" ry="82" fill="none" stroke="#22D3EE" stroke-opacity="0.12"/>

    <path class="trace" d="M704 242 C760 116, 820 116, 872 174 S1002 264, 1136 102" stroke="url(#traceGradient)"/>
    <path class="trace secondary" d="M714 114 C790 262, 866 260, 922 178 S1042 94, 1140 222" stroke="#22D3EE" stroke-opacity="0.68"/>
    <path class="trace secondary" d="M748 300 C822 238, 820 82, 946 102 S1060 250, 1148 274" stroke="#F472B6" stroke-opacity="0.52"/>

    <g filter="url(#softGlow)">
      <circle class="node" cx="778" cy="153" r="6" fill="#22D3EE"/>
      <circle class="node delay-1" cx="872" cy="174" r="7" fill="#A78BFA"/>
      <circle class="node delay-2" cx="976" cy="218" r="6" fill="#F472B6"/>
      <circle class="node delay-1" cx="1064" cy="170" r="5" fill="#67E8F9"/>
    </g>
    <circle cx="944" cy="180" r="18" fill="#0F172A" stroke="#C4B5FD" stroke-width="2"/>
    <circle cx="944" cy="180" r="5" fill="#F8FAFC" filter="url(#softGlow)"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
    <text x="748" y="136" fill="#67E8F9">EXPLORE</text>
    <text x="838" y="156" fill="#C4B5FD">TRACE</text>
    <text x="982" y="246" fill="#F9A8D4">REPAIR</text>
    <text x="1052" y="150" fill="#67E8F9">COMMIT</text>
    <text x="908" y="213" fill="#CBD5E1" font-size="10">DECISION STATE</text>
  </g>
</svg>
